name: Miatoll Port-Mation
run-name: ${{ github.event.inputs.build_name }}

on:
  workflow_dispatch:
    inputs:
      build_name:
        description: "Input Job Name"
        required: true
        default: "Miatoll Port-Mation"

      ota_url:
        description: "OTA full zip URL"
        required: true

      kernel_url:
        description: "Kernel zip URL (AnyKernel3, empty keeps template kernel)"
        required: false
        type: string
        default: ""

      rom_fs:
        description: "Partition filesystem (erofs needs an erofs kernel_url)"
        required: true
        type: choice
        options:
          - ext4
          - erofs
        default: "ext4"

      xdkit_branch:
        description: "xdkit branch to clone"
        required: true
        type: choice
        options:
          - beta
        default: "beta"

      recipe:
        description: "Select The Recipe To Build"
        required: true
        type: choice
        options:
          - miatoll-hyper-cn
          - miatoll-hyper-global
          - miatoll-hyper-xiaomieu
          - miatoll-oplus-cn
          - miatoll-oplus-global
          - miatoll-moto-cn

      super_size:
        description: "Super size (in GB)"
        required: true
        type: string
        default: "8"

      selinux:
        description: "SELinux mode in the boot.img"
        required: true
        type: choice
        options:
          - permissive
          - enforcing
        default: "permissive"

      upload:
        description: "Upload to Pixeldrain and post to Telegram"
        required: true
        type: boolean
        default: true

      is_debug:
        description: "Enable debug mode"
        required: true
        type: boolean
        default: false

jobs:
  build:
    name: ${{ github.event.inputs.build_name }}
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Dhaka
      # big work dir on the runner's larger mount
      ROM_WORK_DIR: /mnt/romwork

    steps:
      - name: Show disk before cleanup
        run: df -h

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          sudo apt-get clean
          docker system prune -af || true
          df -h

      - name: Prepare /mnt workspace
        run: |
          sudo mkdir -p "$ROM_WORK_DIR"
          sudo chown -R "$USER:$USER" "$ROM_WORK_DIR"
          df -h

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            android-sdk-libsparse-utils erofs-utils zstd unzip brotli cpio \
            openjdk-17-jre-headless
          # lpmake/lpunpack and the other native tools ship in xdkit's vendor/bin

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Clone xdkit
        env:
          # read-only deploy key on iput-object/xdkit
          DEPLOY_KEY: ${{ secrets.XDKIT_DEPLOY_KEY }}
          BRANCH: ${{ github.event.inputs.xdkit_branch }}
        run: |
          key="$RUNNER_TEMP/xdkit_key"
          printf '%s\n' "$DEPLOY_KEY" > "$key"
          chmod 600 "$key"
          GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
            git clone --depth 1 -b "$BRANCH" --single-branch \
            git@github.com:iput-object/xdkit.git xdkit
          rm -f "$key"

      - name: Fetch port assets and API tokens from XdOps
        env:
          TOKEN: ${{ secrets.TOKEN }}
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            "https://x-access-token:${TOKEN}@github.com/iput-object/XdOps.git" xdops
          git -C xdops sparse-checkout set --no-cone '/assets/port/' '/tool/secrets/api_tokens'
          mkdir -p xdkit/workbase/assets
          mv xdops/assets/port xdkit/workbase/assets/port
          du -sh xdkit/workbase/assets/port

          # expose the tokens to later steps, masked in every log
          set -a
          . xdops/tool/secrets/api_tokens
          set +a
          for name in PIXELDRAIN_API_KEY TELEGRAM_BOT_TOKEN TELEGRAM_CHANNEL_ID HYPER_VENDOR_API; do
            value="${!name:-}"
            [ -n "$value" ] || { echo "$name not set"; continue; }
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
          rm -rf xdops

      - name: Install xdkit
        working-directory: xdkit
        run: uv sync --frozen --no-dev

      - name: Build ROM
        working-directory: xdkit
        env:
          RECIPE: ${{ github.event.inputs.recipe }}
          OTA_URL: ${{ github.event.inputs.ota_url }}
          KERNEL_URL: ${{ github.event.inputs.kernel_url }}
          ROM_FS: ${{ github.event.inputs.rom_fs }}
          SUPER_SIZE: ${{ github.event.inputs.super_size }}
          SELINUX: ${{ github.event.inputs.selinux }}
          UPLOAD: ${{ github.event.inputs.upload }}
          XDKIT_LOG: ${{ github.event.inputs.is_debug == 'true' && 'debug' || 'info' }}
        run: |
          # --report: on failure, send xdkit-build.log to Telegram
          args=(--root "$ROM_WORK_DIR" --fs "$ROM_FS" --super-size "$SUPER_SIZE" --selinux "$SELINUX"
                --report)
          [ -n "$KERNEL_URL" ] && args+=(--kernel "$KERNEL_URL")
          [ "$UPLOAD" = "true" ] && args+=(--upload --post)
          uv run --no-dev xdkit rom build "$RECIPE" "$OTA_URL" "${args[@]}"

      - name: Show disk after build
        if: always()
        run: df -h
