name: Miatoll Port-Mation
run-name: ${{ github.event.inputs.build_name }}

on:
  workflow_dispatch:
    inputs:
      build_name:
        description: "Input Job Name"
        required: true
        default: "Miatoll Port-Mation"

      ota_url:
        description: "OTA full zip URL"
        required: true

      kernel_url:
        description: "Kernel zip URL (AnyKernel3, empty keeps template kernel)"
        required: false
        type: string
        default: ""

      rom_fs:
        description: "Partition filesystem (erofs needs an erofs kernel_url)"
        required: true
        type: choice
        options:
          - ext4
          - erofs
        default: "ext4"

      xdops_branch:
        description: "XdOps branch to clone"
        required: true
        type: choice
        options:
          - main
          - beta
        default: "main"

      build_selection:
        description: "Select The Script To Build"
        required: true
        type: choice
        options:
          - miatoll_hyper_cn
          - miatoll_hyper_global
          - miatoll_oplus_cn
          - miatoll_oplus_global
          - miatoll_moto_cn
          - miatoll_hyper_xiaomieu

      super_size:
        description: "Super size (in GB)"
        required: true
        type: string
        default: "8"

      is_debug:
        description: "Enable debug mode"
        required: true
        type: boolean
        default: false

jobs:
  build:
    name: ${{ github.event.inputs.build_name }}
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Dhaka

      # Force XdOps work dirs to larger mount
      ROM_WORK_DIR: /mnt/romwork
      FAST_WORK_DIR: /mnt/romwork
      INPUT_DIR: /mnt/romwork/input
      TEMP_DIR: /mnt/romwork/temp
      KITCHEN_DIR: /mnt/romwork/kitchen
      OUTPUT_DIR: /mnt/romwork/output

    steps:
      - name: Checkout this repo (public)
        uses: actions/checkout@v4

      - name: Show disk before cleanup
        run: df -h

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          sudo apt-get clean
          docker system prune -af || true
          df -h

      - name: Prepare /mnt workspace
        run: |
          sudo mkdir -p /mnt/romwork/{input,temp,kitchen,output}
          sudo chown -R "$USER:$USER" /mnt/romwork
          df -h

      - name: Remove public repo files (optional)
        run: rm -rf * .??* || true

      - name: Clone XdOps Repo
        env:
          TOKEN: ${{ secrets.TOKEN }}
        run: |
          git clone -b ${{ github.event.inputs.xdops_branch }} --single-branch \
          https://x-access-token:${TOKEN}@github.com/iput-object/XdOps.git temp_xdops

      - name: Move files from XdOps to root
        run: |
          shopt -s dotglob
          mv temp_xdops/* .
          rm -rf temp_xdops

      - name: Make rom-scripts executable
        run: chmod +x rom-scripts/*.sh

      - name: Run ROM build script
        env:
          IS_DEBUG: ${{ github.event.inputs.is_debug }}
          SUPER_SIZE: ${{ github.event.inputs.super_size }}
          KERNEL_URL: ${{ github.event.inputs.kernel_url }}
          ROM_FS: ${{ github.event.inputs.rom_fs }}
        run: |
          ./rom-scripts/${{ github.event.inputs.build_selection }}.sh \
          "${{ github.event.inputs.ota_url }}"

      - name: Show disk after build
        if: always()
        run: df -h
